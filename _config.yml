# Site settings
title: ZECsy
tagline: Zcash community & marketing team
description: >-
  ZECsy is a Zcash community and marketing team. Find our guides, wallet
  recommendations, merchant tools, merch, and upcoming events — all in one place.

url: "https://zecsy.com"
baseurl: ""

# Social / meta
twitter_handle: ""   # e.g. "zecsy" (without the @)

# Events
# Once the ZECsy Luma calendar exists, paste its embed URL here
# (Luma: open your calendar -> Settings -> Embed -> copy the iframe src).
# It looks like: https://luma.com/embed/calendar/cal-XXXXXXXX/events
# When set, upcoming events display automatically and _data/event.yml is ignored.
luma_embed_url: "https://luma.com/embed/calendar/cal-X5A0GFtG5tqoPAw/events"
luma_calendar_url: "https://luma.com/zecsy"

# Zcash friends directory (/directory/) redirects to OpenZcash communities.
# The homepage button also points there; this URL is kept so existing
# social posts still work.
directory:
  submit_url: "https://github.com/ZECsy-team/ZECsy-team.github.io/issues/new?labels=directory&title=Directory:%20add%20or%20fix%20a%20listing"

# Donation settings
donation:
  uaddress: "u1v39phfw0z0e5yqjlqynzdnf5cqnnrkw2vdf76xk4el0ax5thn7rjn37e86jgw4cwezryekdtaqyyyjz5uj20geghwk6l8spdrvre0pz4"
  label: "Support ZECsy with shielded ZEC"
  description: >-
    We also host workshops for at-risk communities, leveraging credible
    messengers in the local communities. We provide students with a small
    amount of starter ZEC during the class to practice trades, swaps, and
    off-ramping.
  tiers:
    - amount: "$50"
      text: "Student tuition for a ZECsy workshop"
    - amount: "$500"
      text: "Venue fee for a workshop"
    - amount: "$6K"
      text: "Fully covers travel, venue, and tuition for 30 students in a US city"
    - amount: "$2"
      text: "Any small amount helps us reach the users who need financial education"

# Build settings
markdown: kramdown
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts
  - _private
